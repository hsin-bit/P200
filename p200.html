<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機台校正履歷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --bg:#eef2f3;
    --surface:#ffffff;
    --surface-alt:#e6ecee;
    --border:#d2dadd;
    --border-soft:#e2e8ea;
    --ink:#182428;
    --ink-soft:#5c6d73;
    --ink-faint:#8a9aa0;
    --accent:#2b6a73;
    --accent-strong:#1f4f57;
    --accent-soft:#e0eced;
    --accent-ink:#ffffff;
    --placeholder-bg:#fdf3da;
    --placeholder-ink:#8a6a1f;
    --danger:#a23333;
    --danger-soft:#fbe4e4;

    --st-normal-bg:#e2f2e6; --st-normal-ink:#1e6b3f;
    --st-calib-bg:#e2edf5; --st-calib-ink:#275d82;
    --st-pending-bg:#fbeed9; --st-pending-ink:#96591a;
    --st-repair-bg:#f9e2e2; --st-repair-ink:#a23333;
    --st-down-bg:#e6e8e9;  --st-down-ink:#54595c;

    --font-display:'Noto Serif TC','Noto Serif',serif;
    --font-body:'Noto Sans TC','Noto Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12191b;
      --surface:#182123;
      --surface-alt:#1e282b;
      --border:#2c383c;
      --border-soft:#243034;
      --ink:#e7edef;
      --ink-soft:#98a8ad;
      --ink-faint:#6c7d82;
      --accent:#5fb6bf;
      --accent-strong:#83cbd2;
      --accent-soft:#1c343a;
      --accent-ink:#08191c;
      --placeholder-bg:#3a2f14;
      --placeholder-ink:#e3b45c;
      --danger:#e08a8a;
      --danger-soft:#3a1c1c;

      --st-normal-bg:#17301f; --st-normal-ink:#83dca0;
      --st-calib-bg:#182c38;  --st-calib-ink:#8bc6e8;
      --st-pending-bg:#3a2a10; --st-pending-ink:#f0b25c;
      --st-repair-bg:#3a1c1c; --st-repair-ink:#f0a0a0;
      --st-down-bg:#282e30;  --st-down-ink:#b9c1c4;
    }
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:1220px;
    margin:0 auto;
    padding:28px 20px 64px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  header.hero{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
  }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(26px,4vw,34px);
    margin:0;
    text-wrap:balance;
    letter-spacing:.01em;
  }
  .lede{
    margin:0;
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:66ch;
    line-height:1.6;
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
  }
  .stat{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .stat .num{
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
    font-size:22px;
    font-weight:600;
    color:var(--ink);
  }
  .stat.warn .num{ color:var(--st-pending-ink); }
  .stat .label{
    font-size:12px;
    color:var(--ink-soft);
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
  }
  .toolbar input[type="search"],
  .toolbar select{
    font:inherit;
    font-size:13.5px;
    padding:7px 10px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--ink);
  }
  .toolbar input[type="search"]{ flex:1 1 200px; min-width:0; }
  .toolbar .spacer{ flex:1 1 auto; }
  .btn{
    font:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:8px 14px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:disabled{ opacity:0.55; cursor:not-allowed; }
  .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  .btn.primary:hover:not(:disabled){ background:var(--accent-strong); border-color:var(--accent-strong); }
  .save-status{
    font-size:12.5px;
    color:var(--st-normal-ink);
    font-family:var(--font-mono);
  }
  .save-status.dirty{ color:var(--st-pending-ink); }
  .save-status.error{ color:var(--danger); }
  .hint{
    font-size:12.5px;
    color:var(--ink-faint);
    padding:0 2px;
  }

  .table-wrap{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    overflow-x:auto;
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:1230px;
    table-layout:fixed;
  }
  thead th{
    text-align:left;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:12px 10px;
    background:var(--surface-alt);
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody td{
    padding:8px 10px;
    border-bottom:1px solid var(--border-soft);
    vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr.attention{ box-shadow:inset 3px 0 0 var(--st-repair-ink); }

  .cell-input, .cell-select, .cell-textarea{
    width:100%;
    font:inherit;
    font-size:13.5px;
    color:var(--ink);
    background:transparent;
    border:1px solid transparent;
    border-radius:6px;
    padding:6px 7px;
  }
  .cell-textarea{ resize:vertical; min-height:48px; font-family:var(--font-body); line-height:1.4; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .cell-input:hover, .cell-select:hover, .cell-textarea:hover{ border-color:var(--border); }
  .cell-input:focus, .cell-select:focus, .cell-textarea:focus{
    border-color:var(--accent);
    background:var(--bg);
    outline:none;
  }
  .cell-input.placeholder-empty, .cell-textarea.placeholder-empty{
    font-style:italic;
    color:var(--placeholder-ink);
    background:var(--placeholder-bg);
    border-radius:6px;
  }
  select.cell-select.placeholder-empty{
    color:var(--placeholder-ink);
    background:var(--placeholder-bg);
  }
  /* 機台編號字體已縮小為 12.5px */
  .machine-no{ font-family:var(--font-mono); font-weight:600; font-size:12.5px; }

  .status-pill-wrap select.cell-select{
    border-radius:999px;
    padding:6px 10px;
    font-weight:600;
    font-size:12.5px;
    text-align:center;
    appearance:none;
    -webkit-appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
    padding-right:24px;
  }
  .st-normal{ background:var(--st-normal-bg); color:var(--st-normal-ink); }
  .st-calibrating{ background:var(--st-calib-bg); color:var(--st-calib-ink); }
  .st-pending{ background:var(--st-pending-bg); color:var(--st-pending-ink); }
  .st-repair{ background:var(--st-repair-bg); color:var(--st-repair-ink); }
  .st-down{ background:var(--st-down-bg); color:var(--st-down-ink); }
  .st-blank{ background:var(--placeholder-bg); color:var(--placeholder-ink); }

  .history-log{ display:flex; flex-direction:column; gap:6px; }
  .history-list{
    max-height:96px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:5px;
    padding-right:4px;
    scrollbar-width:thin;
  }
  .history-list::-webkit-scrollbar{ width:6px; }
  .history-list::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
  .history-list::-webkit-scrollbar-track{ background:transparent; }
  .history-item{
    font-size:12px;
    line-height:1.45;
    color:var(--ink-soft);
    border-left:2px solid var(--border);
    padding-left:7px;
  }
  .history-item .history-date{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--ink-faint);
    display:block;
  }
  .history-item .history-text{ color:var(--ink); }
  .history-empty{
    font-size:12px;
    font-style:italic;
    color:var(--ink-faint);
  }
  .history-add{
    display:flex;
    gap:5px;
  }
  .history-input{
    flex:1 1 auto;
    min-width:0;
    font:inherit;
    font-size:12.5px;
    padding:5px 7px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--ink);
  }
  .history-add-btn{
    flex:0 0 auto;
    font-size:12px;
    font-weight:600;
    padding:5px 10px;
    border-radius:6px;
    border:1px solid var(--accent);
    background:var(--accent-soft);
    color:var(--accent-strong);
    cursor:pointer;
  }
  .history-add-btn:hover{ background:var(--accent); color:var(--accent-ink); }

  .row-actions{ text-align:right; white-space:nowrap; }
  .icon-btn{
    border:1px solid transparent;
    background:transparent;
    color:var(--ink-faint);
    border-radius:6px;
    padding:6px 9px;
    font-size:12.5px;
    font-family:var(--font-body);
    cursor:pointer;
  }
  .icon-btn:hover{ color:var(--danger); border-color:var(--danger-soft); background:var(--danger-soft); }
  .icon-btn.confirming{
    color:#fff;
    background:var(--danger);
    border-color:var(--danger);
    font-weight:600;
  }

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    font-size:12px;
    color:var(--ink-soft);
    padding:2px 4px;
  }
  .legend .swatch{
    display:inline-block;
    width:10px;height:10px;
    border-radius:3px;
    margin-right:5px;
    vertical-align:-1px;
  }
  .empty-note{
    padding:30px;
    text-align:center;
    color:var(--ink-faint);
    font-size:14px;
  }

  @media (max-width:760px){
    table, thead, tbody, tr, td{ display:block; width:100%; }
    thead{ display:none; }
    tbody tr{
      border:1px solid var(--border);
      border-radius:10px;
      margin-bottom:12px;
      padding:6px 4px;
      background:var(--surface);
    }
    tbody tr.attention{ box-shadow:none; border-left:3px solid var(--st-repair-ink); }
    table{ min-width:0; }
    tbody td{
      border-bottom:1px dashed var(--border-soft);
      display:flex;
      align-items:center;
      gap:10px;
      padding:9px 10px;
    }
    tbody td:last-child{ border-bottom:none; }
    tbody td::before{
      content:attr(data-label);
      flex:0 0 92px;
      font-size:11.5px;
      font-weight:600;
      color:var(--ink-faint);
      text-transform:uppercase;
      letter-spacing:.04em;
    }
    .row-actions{ justify-content:flex-end; text-align:left; }
    .row-actions::before{ content:""; flex:0 0 0; }
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(12px);
    background:var(--ink);
    color:var(--bg);
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:20;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

    var fallback = [];
    try{
      fallback = JSON.parse(document.getElementById("default-data").textContent) || [];
    }catch(e){ fallback = []; }

    if(!isConfigured()){
      state = fallback;
      setSyncState("error", "尚未設定 GAS 網址（目前僅顯示本機預設資料）");
      render();
      return;
    }

    setSyncState("loading", "正在從 Google 試算表載入最新資料...");
    render();

    fetch(GAS_WEB_APP_URL)
      .then(function(res){ return res.json(); })
      .then(function(json){
        if(json.status === "ok" && Array.isArray(json.data)){
          if(json.data.length === 0 && fallback.length > 0){
            state = fallback;
            setSyncState("saving", "首次啟動，正在將初始機台資料寫入 Google 試算表...");
            render();
            saveToCloud(true);
          } else {
            state = json.data;
            setSyncState("synced", "已與 Google 試算表同步");
            render();
          }
        } else {
          throw new Error(json.message || "回傳格式錯誤");
        }
      })
      .catch(function(err){
        state = fallback;
        setSyncState("error", "雲端讀取失敗，暫時顯示備份資料");
        showToast("無法連線至 Google 試算表，請檢查 GAS 部署權限");
        render();
      });
  }

  function scheduleAutoSave(){
    setSyncState("dirty", "有未儲存的變更（1.5秒後自動同步）...");
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(function(){
      saveToCloud(false);
    }, 1500);
  }

  function saveToCloud(isInit){
    clearTimeout(autoSaveTimer);
    if(!isConfigured()){
      showToast("請先在 HTML 程式碼中填入 GAS_WEB_APP_URL");
      return;
    }
    setSyncState("saving", "正在儲存至 Google 試算表...");

    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ data: state })
    })
    .then(function(res){ return res.json(); })
    .then(function(json){
      if(json.status === "ok"){
        var now = new Date();
        var hh = String(now.getHours()).padStart(2, "0");
        var mm = String(now.getMinutes()).padStart(2, "0");
        var ss = String(now.getSeconds()).padStart(2, "0");
        setSyncState("synced", "已儲存至雲端 (" + hh + ":" + mm + ":" + ss + ")");
        if(isInit) showToast("已自動將 12 筆機台資料初始化至 Google 試算表");
      } else {
        throw new Error(json.message || "寫入失敗");
      }
    })
    .catch(function(err){
      setSyncState("error", "儲存失敗，請點「立即同步儲存」重試");
      showToast("雲端儲存失敗：" + err.message);
    });
  }

  function setSyncState(status, msg){
    syncStatus = status;
    syncMsg = msg;
    var el = document.getElementById("save-status");
    if(el){
      el.textContent = msg;
      el.className = "save-status" + (status === "dirty" || status === "saving" ? " dirty" : (status === "error" ? " error" : ""));
    }
  }

  function nextMachineLabel(){
    var max = 0;
    state.forEach(function(r){
      var m = /#(\d+)/.exec(r.machineNo || "");
      if(m){ max = Math.max(max, parseInt(m[1],10)); }
    });
    return "#" + (max + 1);
  }

  function needsAttention(r){
    return r.status === "repair" || r.status === "down" || (r.issue && r.issue.trim().length>0);
  }

  function computeStats(){
    var total = state.length;
    var attention = state.filter(needsAttention).length;
    var lastUpdated = "";
    state.forEach(function(r){ if(r.updatedAt && r.updatedAt > lastUpdated) lastUpdated = r.updatedAt; });
    return { total:total, attention:attention, lastUpdated:lastUpdated };
  }

  function historyLogHTML(r){
    var items = Array.isArray(r.history) ? r.history.slice().reverse() : [];
    var listHTML = items.length
      ? items.map(function(h){
          return '<div class="history-item"><span class="history-date">' + escText(fmtDate(h.date)) + '</span><span class="history-text">' + escText(h.note) + '</span></div>';
        }).join('')
      : '<div class="history-empty">尚無紀錄</div>';
    var html = '<div class="history-log" data-hist="' + escAttr(r.id) + '">';
    html += '<div class="history-list">' + listHTML + '</div>';
    html += '<div class="history-add"><input type="text" class="history-input" data-hist-input="' + escAttr(r.id) + '" placeholder="新增一筆紀錄…"><button type="button" class="history-add-btn" data-hist-add="' + escAttr(r.id) + '">新增</button></div>';
    html += '</div>';
    return html;
  }

  function optionsHTML(list, current){
    var html = '<option value="">— 未設定 —</option>';
    list.forEach(function(opt){
      html += '<option value="' + escAttr(opt.value) + '"' + (opt.value===current?" selected":"") + '>' + escText(opt.label) + "</option>";
    });
    return html;
  }

  /* 匯出所有設定與輸入值為 CSV 檔案（含 UTF-8 BOM 確保 Excel 開啟無亂碼） */
  function exportToCSV(){
    if(!state || state.length === 0){
      showToast("目前沒有資料可匯出");
      return;
    }

    var headers = [
      "機台編號",
      "設備序號",
      "專案號",
      "擺放位置",
      "軟體版次",
      "校正方式",
      "目前設備狀態",
      "待處理問題",
      "設備履歷紀錄",
      "資料更新日期"
    ];

    function csvCell(val){
      var str = String(val == null ? "" : val);
      return '"' + str.replace(/"/g, '""') + '"';
    }

    var lines = [headers.map(csvCell).join(",")];

    state.forEach(function(r){
      var statusLabel = (STATUS_MAP[r.status] && STATUS_MAP[r.status].label) ? STATUS_MAP[r.status].label : (r.status || "未設定");
      var historyStr = Array.isArray(r.history) && r.history.length > 0
        ? r.history.map(function(h){ return "[" + fmtDate(h.date) + "] " + (h.note || ""); }).join(" | ")
        : "";

      var rowCells = [
        r.machineNo || "",
        r.serial || "",
        r.projectNo || "",
        r.location || "",
        r.swVersion || "",
        r.calibMethod || "",
        statusLabel,
        r.issue || "",
        historyStr,
        r.updatedAt || ""
      ];
      lines.push(rowCells.map(csvCell).join(","));
    });

    var csvContent = "\uFEFF" + lines.join("\r\n");
    var blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "機台校正履歷_" + todayISO() + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    showToast("已匯出 CSV 檔案（共 " + state.length + " 筆機台資料）");
  }

  function render(){
    var stats = computeStats();
    var q = filters.q.trim().toLowerCase();
    var visible = state.filter(function(r){
      var histText = (Array.isArray(r.history) ? r.history.map(function(h){ return h.note; }) : []).join(" ");
      var matchesQ = !q || [r.machineNo,r.serial,r.projectNo,r.location,histText].some(function(v){ return (v||"").toLowerCase().indexOf(q)>=0; });
      var matchesStatus = !filters.status || r.status === filters.status;
      return matchesQ && matchesStatus;
    });

    var statusClsExtra = (syncStatus === "dirty" || syncStatus === "saving") ? " dirty" : (syncStatus === "error" ? " error" : "");

    var html = '';
    html += '<header class="hero">';
    html += '  <span class="eyebrow">EnliTech 客服部 · 設備追蹤（雲端多人協作版）</span>';
    html += '  <h1>機台校正履歷</h1>';
    html += '  <p class="lede">依機台分類記錄專案號、設備序號、擺放位置、校正方式與目前狀態。所有修改皆會自動同步儲存至 Google 試算表，供團隊成員即時查閱與更新。</p>';
    html += '</header>';

    html += '<section class="stats">';
    html += '  <div class="stat"><span class="num mono">' + stats.total + '</span><span class="label">機台總數</span></div>';
    html += '  <div class="stat' + (stats.attention>0 ? ' warn' : '') + '"><span class="num mono">' + stats.attention + '</span><span class="label">需留意（維修／停機／待處理）</span></div>';
    html += '  <div class="stat"><span class="num mono">' + (fmtDate(stats.lastUpdated) || "—") + '</span><span class="label">最後更新日期</span></div>';
    html += '</section>';

    html += '<section class="toolbar">';
    html += '  <input type="search" id="search-input" placeholder="搜尋機台編號、序號、專案號或位置" value="' + escAttr(filters.q) + '">';
    html += '  <select id="status-filter"><option value="">全部狀態</option>';
    STATUS_OPTIONS.forEach(function(opt){
      html += '<option value="' + escAttr(opt.value) + '"' + (filters.status===opt.value?" selected":"") + '>' + escText(opt.label) + '</option>';
    });
    html += '  </select>';
    html += '  <span class="spacer"></span>';
    html += '  <span class="save-status' + statusClsExtra + '" id="save-status">' + escText(syncMsg) + '</span>';
    html += '  <button class="btn" id="reload-btn" type="button">重新載入</button>';
    html += '  <button class="btn" id="export-csv-btn" type="button">匯出 CSV</button>';
    html += '  <button class="btn" id="add-row-btn" type="button">＋ 新增機台</button>';
    html += '  <button class="btn primary" id="save-btn" type="button">立即同步儲存</button>';
    html += '</section>';
    html += '<p class="hint">提示：修改欄位後停止輸入 1.5 秒即會自動儲存至雲端；點選「匯出 CSV」可下載完整備份表格。</p>';

    html += '<div class="table-wrap">';
    if(syncStatus === "loading" && state.length === 0){
      html += '<div class="empty-note">正在從 Google 試算表載入機台資料，請稍候...</div>';
    } else if(visible.length === 0){
      html += '<div class="empty-note">沒有符合條件的機台。</div>';
    } else {
      html += '<table><colgroup>';
      [56,118,102,98,105,150,118,125,185,112,56].forEach(function(w){ html += '<col style="width:' + w + 'px">'; });
      html += '</colgroup><thead><tr>';
      ["機台編號","設備序號","專案號","擺放位置","軟體版次","校正方式","目前設備狀態","待處理問題","設備履歷紀錄","資料更新日期",""].forEach(function(h){
        html += '<th>' + escText(h) + '</th>';
      });
      html += '</tr></thead><tbody>';
      visible.forEach(function(r){
        var att = needsAttention(r);
        var statusOpt = STATUS_MAP[r.status];
        var statusCls = statusOpt ? statusOpt.cls : "st-blank";
        html += '<tr data-id="' + escAttr(r.id) + '"' + (att ? ' class="attention"' : '') + '>';

        html += '<td data-label="機台編號"><input class="cell-input mono machine-no" data-field="machineNo" value="' + escAttr(r.machineNo) + '"></td>';
        html += '<td data-label="設備序號"><input class="cell-input mono' + (r.serial? '' : ' placeholder-empty') + '" data-field="serial" placeholder="待補充" value="' + escAttr(r.serial) + '"></td>';
        html += '<td data-label="專案號"><input class="cell-input mono' + (r.projectNo? '' : ' placeholder-empty') + '" data-field="projectNo" placeholder="待補充" value="' + escAttr(r.projectNo) + '"></td>';
        html += '<td data-label="擺放位置"><input class="cell-input' + (r.location? '' : ' placeholder-empty') + '" data-field="location" placeholder="待補充" value="' + escAttr(r.location) + '"></td>';
        html += '<td data-label="軟體版次"><input class="cell-input mono' + (r.swVersion? '' : ' placeholder-empty') + '" data-field="swVersion" placeholder="待補充" value="' + escAttr(r.swVersion) + '"></td>';
        html += '<td data-label="校正方式"><input class="cell-input" list="calib-options" data-field="calibMethod" placeholder="待補充" value="' + escAttr(r.calibMethod) + '"></td>';
        html += '<td data-label="目前設備狀態" class="status-pill-wrap"><select class="cell-select ' + statusCls + '" data-field="status">' + optionsHTML(STATUS_OPTIONS, r.status) + '</select></td>';
        html += '<td data-label="待處理問題"><textarea class="cell-textarea' + (r.issue? '' : ' placeholder-empty') + '" data-field="issue" placeholder="待補充" rows="1">' + escText(r.issue) + '</textarea></td>';
        html += '<td data-label="設備履歷紀錄">' + historyLogHTML(r) + '</td>';
        html += '<td data-label="更新日期"><input type="date" class="cell-input mono" data-field="updatedAt" value="' + escAttr(r.updatedAt) + '"></td>';
        html += '<td class="row-actions" data-label=""><button type="button" class="icon-btn' + (confirmDeleteId===r.id?' confirming':'') + '" data-del="' + escAttr(r.id) + '">' + (confirmDeleteId===r.id ? '確定刪除？' : '刪除') + '</button></td>';

        html += '</tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';

    html += '<datalist id="calib-options">' + CALIB_OPTIONS.map(function(c){ return '<option value="' + escAttr(c) + '">'; }).join('') + '</datalist>';

    html += '<div class="legend">';
    STATUS_OPTIONS.forEach(function(opt){
      html += '<span><span class="swatch ' + opt.cls + '"></span>' + escText(opt.label) + '</span>';
    });
    html += '  <span><span class="swatch" style="background:var(--placeholder-bg)"></span>待補充欄位</span>';
    html += '</div>';

    html += '<div class="toast" id="toast"></div>';

    app.innerHTML = html;
    bindEvents();
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    if(!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove("show"); }, 3000);
  }

  function findRow(id){
    for(var i=0;i<state.length;i++){ if(state[i].id===id) return state[i]; }
    return null;
  }

  function bindEvents(){
    var search = document.getElementById("search-input");
    if(search){
      search.addEventListener("input", function(){ filters.q = search.value; render(); preserveFocus(search); });
    }
    var statusFilter = document.getElementById("status-filter");
    if(statusFilter){
      statusFilter.addEventListener("change", function(){ filters.status = statusFilter.value; render(); });
    }
    var reloadBtn = document.getElementById("reload-btn");
    if(reloadBtn){
      reloadBtn.addEventListener("click", function(){
        clearTimeout(autoSaveTimer);
        loadInitialData();
      });
    }
    var exportCsvBtn = document.getElementById("export-csv-btn");
    if(exportCsvBtn){
      exportCsvBtn.addEventListener("click", exportToCSV);
    }
    var addBtn = document.getElementById("add-row-btn");
    if(addBtn){
      addBtn.addEventListener("click", function(){
        var row = { id:uid(), machineNo:nextMachineLabel(), serial:"", projectNo:"", location:"", swVersion:"", calibMethod:"", status:"", issue:"", updatedAt: todayISO(), history:[{date:todayISO(), note:"建立機台紀錄"}] };
        state.push(row);
        render();
        saveToCloud(false);
      });
    }
    var saveBtn = document.getElementById("save-btn");
    if(saveBtn){
      saveBtn.addEventListener("click", function(){ saveToCloud(false); });
    }

    app.querySelectorAll("tbody tr").forEach(function(tr){
      var id = tr.getAttribute("data-id");
      tr.querySelectorAll("[data-field]").forEach(function(el){
        var field = el.getAttribute("data-field");
        var evt = (el.tagName === "SELECT" || el.type === "date") ? "change" : "input";
        el.addEventListener(evt, function(){
          var row = findRow(id);
          if(!row) return;
          row[field] = el.value;
          scheduleAutoSave();

          if(field === "serial" || field === "projectNo" || field === "location" || field === "swVersion" || field === "issue"){
            el.classList.toggle("placeholder-empty", !el.value);
          }
          if(field === "status"){
            STATUS_OPTIONS.forEach(function(o){ el.classList.remove(o.cls); });
            el.classList.remove("st-blank");
            el.classList.add(STATUS_MAP[el.value] ? STATUS_MAP[el.value].cls : "st-blank");
            tr.classList.toggle("attention", needsAttention(row));
          }
        });
      });

      var histInput = tr.querySelector("[data-hist-input]");
      var histBtn = tr.querySelector("[data-hist-add]");
      if(histInput && histBtn){
        var doAppend = function(){ appendHistory(id, histInput); };
        histBtn.addEventListener("click", doAppend);
        histInput.addEventListener("keydown", function(e){
          if(e.key === "Enter"){ e.preventDefault(); doAppend(); }
        });
      }

      var delBtn = tr.querySelector("[data-del]");
      if(delBtn){
        delBtn.addEventListener("click", function(){
          if(confirmDeleteId === id){
            state = state.filter(function(r){ return r.id !== id; });
            confirmDeleteId = null;
            clearTimeout(confirmDeleteTimer);
            render();
            saveToCloud(false);
          } else {
            confirmDeleteId = id;
            clearTimeout(confirmDeleteTimer);
            confirmDeleteTimer = setTimeout(function(){ confirmDeleteId = null; render(); }, 3000);
            render();
          }
        });
      }
    });
  }

  function appendHistory(rowId, inputEl){
    var text = inputEl.value.trim();
    if(!text) return;
    var row = findRow(rowId);
    if(!row) return;
    if(!Array.isArray(row.history)) row.history = [];
    var entry = { date: todayISO(), note: text };
    row.history.push(entry);
    inputEl.value = "";

    var wrap = app.querySelector('.history-log[data-hist="' + rowId.replace(/"/g,'\\"') + '"]');
    if(wrap){
      var list = wrap.querySelector(".history-list");
      if(list){
        var emptyNote = list.querySelector(".history-empty");
        if(emptyNote) emptyNote.remove();
        var item = document.createElement("div");
        item.className = "history-item";
        var dateSpan = document.createElement("span");
        dateSpan.className = "history-date";
        dateSpan.textContent = fmtDate(entry.date);
        var textSpan = document.createElement("span");
        textSpan.className = "history-text";
        textSpan.textContent = entry.note;
        item.appendChild(dateSpan);
        item.appendChild(textSpan);
        list.insertBefore(item, list.firstChild);
        list.scrollTop = 0;
      }
    }
    inputEl.focus();
    saveToCloud(false);
  }

  function preserveFocus(el){
    var pos = el.value.length;
    setTimeout(function(){
      var again = document.getElementById(el.id);
      if(again){ again.focus(); again.setSelectionRange(pos,pos); }
    },0);
  }

  window.addEventListener("beforeunload", function(e){
    if(syncStatus === "dirty" || syncStatus === "saving"){
      e.preventDefault();
      e.returnValue = "";
    }
  });

  loadInitialData();
})();
</script>
</body>
</html>
